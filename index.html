<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Laser Runner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="점프와 슬라이딩으로 레이저를 피하는 러너 게임"></canvas>

    <section id="hud" aria-live="polite">
      <div class="hud-item">
        <span>TIME</span>
        <strong id="time">00.00</strong>
      </div>
      <div class="hud-item center">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-item right">
        <span>BEST</span>
        <strong id="best">0</strong>
      </div>
    </section>

    <button id="pause" class="icon-button" type="button" aria-label="일시 정지">Ⅱ</button>

    <section id="controls" aria-label="게임 조작">
      <button id="slide" class="control-button" type="button">
        <span class="control-icon">↓</span>
        <span>SLIDE</span>
      </button>
      <button id="jump" class="control-button" type="button">
        <span class="control-icon">↑</span>
        <span>JUMP</span>
      </button>
    </section>

    <section id="start-panel" class="overlay">
      <div class="panel">
        <h1>LASER RUNNER</h1>
        <p>낮은 레이저는 점프하고<br>높은 레이저는 슬라이딩하세요.</p>
        <p class="hint">위·아래 스와이프 또는 화면 버튼</p>
        <button id="start" class="primary-button" type="button">START</button>
      </div>
    </section>

    <section id="game-over-panel" class="overlay hidden">
      <div class="panel">
        <h2>GAME OVER</h2>
        <p>생존 시간 <strong id="final-time">0.00</strong>초</p>
        <p>점수 <strong id="final-score">0</strong></p>
        <button id="restart" class="primary-button" type="button">RESTART</button>
      </div>
    </section>

    <section id="pause-panel" class="overlay hidden">
      <div class="panel">
        <h2>PAUSED</h2>
        <button id="resume" class="primary-button" type="button">RESUME</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
