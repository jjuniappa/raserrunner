<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07101d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Laser Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="레이저를 점프와 슬라이딩으로 피하는 러너 게임"></canvas>

    <section id="hud">
      <div><span>TIME</span><strong id="time">00.00</strong></div>
      <div class="center"><span>SCORE</span><strong id="score">0</strong></div>
      <div class="right"><span>BEST</span><strong id="best">0</strong></div>
    </section>

    <button id="pause" class="pause-button" type="button" aria-label="일시 정지">Ⅱ</button>

    <section id="start-panel" class="overlay">
      <div class="panel">
        <h1>LASER<br>RUNNER</h1>
        <p>낮은 레이저는 점프<br>높은 레이저는 슬라이딩</p>
        <small>화면 터치: 점프 · 아래 스와이프: 슬라이딩</small>
        <button id="start" class="primary" type="button">START</button>
      </div>
    </section>

    <section id="game-over-panel" class="overlay hidden">
      <div class="panel">
        <h2>GAME OVER</h2>
        <p>TIME <strong id="final-time">0.00</strong></p>
        <p>SCORE <strong id="final-score">0</strong></p>
        <button id="restart" class="primary" type="button">RESTART</button>
      </div>
    </section>

    <section id="pause-panel" class="overlay hidden">
      <div class="panel">
        <h2>PAUSED</h2>
        <button id="resume" class="primary" type="button">RESUME</button>
      </div>
    </section>

    <section id="loading" class="overlay">
      <div class="panel"><p>에셋 불러오는 중…</p></div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
